<style>
:root{--paper:#F5EFDF;--paper2:#EBE2CB;--ink:#2B2622;--ink2:#6B6052;--red:#B8352B;--gold:#C9A227;--line:#CDBF9F;

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#E9DFC4;color:var(--ink);font:15px/1.45 "Zen Maru Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.panel{background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 0 0 4px var(--paper),0 0 0 5px var(--line),0 14px 40px rgba(43,38,34,.28);border-radius:4px}

.rank{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}.item .big{font:800 22px "Shippori Mincho B1",serif;color:var(--red)}
.item .lg{margin-left:auto;flex:none;border:0;background:var(--red);color:var(--paper);font:800 13px "Zen Maru Gothic";min-height:40px;padding:8px 12px;border-radius:3px;cursor:pointer}.item>div{min-width:0}

.sh-hd{position:sticky;top:0;z-index:3;background:var(--paper)}.grab{display:none}

.nv{border:1.5px solid var(--ink);background:#FFFCF3;padding:12px;margin:0}.nvh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.nvh b{font:800 18px "Shippori Mincho B1",serif;color:var(--red)}
.xrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}.xrow span{font:800 13px "Shippori Mincho B1",serif;letter-spacing:.12em;text-transform:uppercase}.xread{font:800 36px/1 "Shippori Mincho B1",serif;color:var(--red)}

.vdone{width:100%;margin-top:8px;min-height:46px;border:0;background:var(--red);color:var(--paper);font:900 16px "Zen Maru Gothic";border-radius:3px;cursor:pointer}
