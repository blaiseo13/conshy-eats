<style>
/* Layout: full-bleed 3D map; frosted-glass panels float over it (left list + right spot card on desktop, bottom sheets on phone). */
:root{
  --ink:#0F172A; --ink2:#475569; --ink3:#94A3B8;
  --accent:#4F46E5; --food:#EA580C; --exp:#4F46E5; --gold:#E9A800;
  --green:#059669; --amber:#D97706; --red:#DC2626;
  --ground:#E9EDF2;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.75);
  --hair:rgba(15,23,42,.08); --chip:rgba(15,23,42,.06);
  --shadow:0 12px 40px rgba(15,23,42,.16), 0 2px 6px rgba(15,23,42,.06);
  --font:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.ro #sbtn,.ro #logV,.ro #wantB,.ro #editSpot,.ro #hideSpot,.ro #delSpot,.ro [data-ev],.ro [data-dv],.ro #bAdd,.ro [data-star],.ro #dbody .sec:last-child{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;z-index:0}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--glass-line);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);border-radius:20px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.up{animation:up .28s ease-out both}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- left panel / phone sheet ---------- */
#left{position:fixed;z-index:5;top:max(16px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:350px;display:flex;flex-direction:column;overflow:hidden}
.handle{display:none}
.brand{display:flex;align-items:center;gap:12px;padding:18px 20px 6px}
.logo{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:21px;background:linear-gradient(140deg,#FDBA74,#F97316 45%,#6366F1);box-shadow:0 6px 16px rgba(99,102,241,.35), inset 0 1px 0 rgba(255,255,255,.5)}
.brand h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}
.kpi{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:14px;padding:9px 11px}
.kpi .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.kpi .v small{font-size:12px;color:var(--ink3);font-weight:600}
.kpi .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.champ{margin:0 16px 10px;border-radius:16px;padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;background:linear-gradient(120deg,rgba(255,236,170,.85),rgba(255,255,255,.55));border:1px solid rgba(233,168,0,.35);transition:transform .15s}
.champ:hover{transform:translateY(-2px)}
.champ .cr{font-size:26px}
.champ .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.champ .s{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.champ .big{margin-left:auto;font-size:26px;font-weight:800;color:#A67500}
.tabs{display:flex;gap:2px;margin:0 16px;padding:3px;border-radius:12px;background:var(--chip)}
.tab{flex:1;border:0;background:none;padding:7px 4px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.tab .c{font-size:10.5px;color:var(--ink3);margin-left:3px}
.search{margin:10px 16px 4px;position:relative}
.search input{width:100%;border:1px solid var(--glass-line);border-radius:12px;padding:9px 12px 9px 32px;font:inherit;background:var(--glass-strong);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.search span{position:absolute;left:12px;top:8px;color:var(--ink3)}
#list{flex:1;overflow:auto;padding:4px 10px 10px;min-height:0}
.row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;cursor:pointer;transition:background .12s}
.row:hover{background:rgba(255,255,255,.6)}
.row.sel{background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(15,23,42,.08)}
.rank{width:24px;text-align:center;font-weight:800;color:var(--ink3);font-size:13px;flex:none}
.rank.m{font-size:18px}
.emo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:18px;flex:none;border:1px solid var(--glass-line)}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:4px;margin-top:5px}
.mini i{height:4px;border-radius:3px;display:block;background:var(--chip);flex:1;position:relative;overflow:hidden}
.mini i b{position:absolute;inset:0 auto 0 0;border-radius:3px}
.badge{min-width:44px;text-align:center;font-weight:800;font-size:14px;border-radius:10px;padding:5px 6px;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.badge.none{background:var(--chip);color:var(--ink3);font-weight:600;font-size:12px;box-shadow:none}
.star{border:0;background:none;font-size:16px;color:var(--ink3);padding:2px;flex:none}
.star.on{color:var(--gold)}
.empty{color:var(--ink2);font-size:13px;text-align:center;padding:22px 12px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.foot{border-top:1px solid var(--hair);padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.dot.ok{background:var(--green)}
.foot .sp{flex:1}
.savebtn{border:1px solid var(--glass-line);background:var(--glass-strong);border-radius:9px;padding:5px 12px;font-weight:700;font-size:12px;color:var(--accent)}

/* ---------- spot card ---------- */
#drawer{position:fixed;z-index:7;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:410px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(460px);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#drawer.open{transform:none}
.dhead{padding:18px 20px 12px;position:relative}
.x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:10px;border:1px solid var(--glass-line);background:var(--glass-strong);color:var(--ink2)}
.dhead h2{margin:0 40px 0 0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.addr{color:var(--ink2);font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--chip);color:#334155}
.chip.y{background:rgba(233,168,0,.16);color:#8A6100}.chip.i{background:rgba(79,70,229,.1);color:var(--accent)}
#dbody{flex:1;overflow:auto;padding:6px 20px 24px;min-height:0}
.card{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:16px;padding:16px}
.scorecard{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-size:34px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.ring .mid span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.halves{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.half .top{display:flex;justify-content:space-between;align-items:baseline}
.half .top b{font-size:20px;font-weight:800}
.bar{height:8px;background:var(--chip);border-radius:6px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.half small{color:var(--ink3);font-size:11.5px}
.formula{margin-top:12px;font-size:12px;color:var(--ink2);text-align:center}
.note-y{margin-top:10px;font-size:12px;border-radius:12px;padding:8px 10px;background:rgba(253,230,138,.6);color:#78350F;text-align:center}
.sec{margin-top:20px}
.sec>.label{margin-bottom:8px;display:block}
.dish{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--hair)}
.dish:last-child{border:0}
.dish .nm{flex:1;font-weight:500;min-width:0}
.dish .nm small{color:var(--ink3);font-weight:500;margin-left:4px}
.pill{font-weight:800;font-size:13px;border-radius:8px;padding:3px 8px;color:#fff;min-width:40px;text-align:center}
.visit{margin-bottom:10px}
.vh{display:flex;align-items:center;gap:8px}
.vh b{font-weight:700}
.vh .sp{flex:1}
.ib{border:1px solid var(--glass-line);background:rgba(255,255,255,.8);border-radius:9px;width:30px;height:30px;color:var(--ink2);font-size:13px}
.vd{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.vchip{font-size:12px;background:rgba(234,88,12,.1);color:#9A3412;border-radius:8px;padding:3px 8px}
.vchip b{margin-left:4px}
.vnote{margin-top:8px;font-size:12.5px;color:var(--ink2);font-style:italic}
.confirm{margin-top:8px;font-size:12px;display:flex;gap:6px;align-items:center;color:var(--red)}
.btn{border-radius:12px;padding:10px 14px;font-weight:700;border:1px solid transparent;font-size:13px}
.btn.p{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.btn.g{background:var(--glass-strong);border-color:var(--glass-line);color:#334155}
.btn.d{background:rgba(255,255,255,.8);border-color:rgba(220,38,38,.3);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btnrow .grow{flex:1}
.f{display:flex;flex-direction:column;gap:14px}
.f .l{font-size:12px;font-weight:700;color:#334155;display:block;margin-bottom:6px}
.f input[type=text],.f textarea{width:100%;border:1px solid var(--glass-line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;outline:none;background:rgba(255,255,255,.85)}
.f input[type=text]:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
.f input.bad{border-color:var(--red)}
.f textarea{min-height:64px;resize:vertical}
.slider{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:var(--accent);height:28px}
.slider .val{min-width:70px;text-align:right;font-weight:800;font-size:18px}
.slider .val small{font-size:16px;margin-left:3px}
.dishrow{border:1px solid var(--glass-line);border-radius:14px;padding:10px 12px;background:rgba(255,247,237,.75)}
.dishrow .top{display:flex;gap:8px;margin-bottom:4px}
.dishrow .top input{flex:1;min-width:0}
.dishrow .slider input{accent-color:var(--food)}
.hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
.vf-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vf-date{display:flex;align-items:center;gap:8px}.vf-date input{width:110px!important;padding:7px 10px!important}
.hint a{color:var(--accent)}
.pickedbar{margin-bottom:6px}
.menulist{display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto;padding:2px;border-radius:14px}
.msec{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:10px 4px 2px}
.mi{border:1px solid var(--glass-line);background:rgba(255,255,255,.7);border-radius:12px;transition:background .15s}
.mi.on{background:rgba(255,247,237,.95);border-color:rgba(234,88,12,.35)}

  const cust=(S.custom||[]).map(p=>({...p,custom:true}));
  return base.concat(cust).map(p=>{ const st=S.spots[p.id]||{}; return {...p,...(st.edit||{}),id:p.id,lat:p.lat,lng:p.lng,visits:st.visits||[],want:!!st.want,hidden:!!st.hidden}; });

function scores(p){
  if(preview && preview[p.id]) return preview[p.id];
  const dishes=[], exps=[];
  for(const v of p.visits){ for(const d of v.dishes||[]) if(typeof d.score==='number') dishes.push(d); if(typeof v.experience==='number') exps.push(v.experience); }
  const food=mean(dishes.map(d=>d.score)), exp=mean(exps);
  const combined=(food!=null && exp!=null)?(food+exp)/2:null;
  const agg={}; for(const d of dishes){ const k=d.name.trim().toLowerCase(); (agg[k]=agg[k]||{name:d.name.trim(),s:[]}).s.push(d.score); }
  const dishList=Object.values(agg).map(a=>({name:a.name,score:mean(a.s),n:a.s.length})).sort((a,b)=>b.score-a.score);
  return {food,exp,combined,dishCount:dishes.length,dishList,best:dishList[0]||null,visits:p.visits.length};
}

const markers={};

function labelHTML(p){
  const s=p.ds, col=p.rank===1?'#E9A800':scoreColor(s);

}
function syncMarkers(){
  const seen=new Set();
  for(const p of PLACES){
    if(p.hidden) continue; seen.add(p.id);
    let m=markers[p.id];
    if(!m){ const el=document.createElement('div'); el.className='mk'; const pid=p.id;
      el.addEventListener('click',ev=>{ if(ev.target.closest('.flag')){ ev.stopPropagation(); if(!addMode) select(pid,true); } });
      m=markers[p.id]={el,mk:new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([p.lng,p.lat]).addTo(map)}; }
    m.mk.setLngLat([p.lng,p.lat]);
    const html=labelHTML(p); if(m.html!==html){ m.el.innerHTML=html; m.html=html; }
    m.rated=p.ds!=null; m.rank=p.rank||999; m.want=p.want; m.scale=labelScale(p); m.p=p;
    m.el.classList.toggle('small',!m.rated); m.el.classList.toggle('sel',p.id===selectedId);
    m.el.style.zIndex=m.rated?String(1000-m.rank):(p.id===selectedId?'999':'1');
  }

}
function positionMarkers(){
  const z=map.getZoom(), pitch=map.getPitch()*Math.PI/180, br=map.getBearing()*Math.PI/180;
  const cands=[];
  for(const p of PLACES){
    const m=markers[p.id]; if(!m) continue;
    const cur=anim[p.id]||{S:0,P:0};
    const dm=20, dLng=dm/(111320*Math.cos(p.lat*Math.PI/180))*Math.cos(br), dLat=-dm/111320*Math.sin(br);
    const a=map.project([p.lng,p.lat]), b=map.project([p.lng+dLng,p.lat+dLat]);
    const ppm=Math.hypot(b.x-a.x,b.y-a.y)/dm;
    const top=cur.P+MODELS[p.mkey].top*cur.S;
    const off=top*ppm*Math.sin(pitch)+4;
    m.mk.setOffset([0,-off]);
    const named=m.rated || p.id===selectedId || (m.want?z>15.4:z>16.4) || (searchTerm && matchesSearch(p));
    m.vis=named && !(searchTerm && !matchesSearch(p));
    m.el.classList.toggle('hidez',!m.vis); m.el.classList.remove('compact');
    if(m.vis){ m.sx=a.x; m.sy=a.y-off; m.prio=p.id===selectedId?-1:(m.rated?m.rank:(m.want?500:800)); cands.push(m); }
  }
  cands.sort((x,y)=>x.prio-y.prio);
  const placed=[], hit=b=>placed.some(q=>b[0]<q[2]&&b[2]>q[0]&&b[1]<q[3]&&b[3]>q[1]);
  for(const m of cands){
    const sc=m.scale||1, w=(m.p.name.length*7.3+(m.rated?78:40))*sc, h=30*sc;
    const box=[m.sx-w/2-4,m.sy-h-12,m.sx+w/2+4,m.sy-10];
    if(!hit(box)||m.prio===-1){ placed.push(box); continue; }
    if(m.rated){ const cw=62*sc, cb=[m.sx-cw/2,m.sy-28*sc-10,m.sx+cw/2,m.sy-10]; if(!hit(cb)){ m.el.classList.add('compact'); placed.push(cb); continue; } }
    m.el.classList.add('hidez');
  }
}

const TIERS=[[9,'🏆','Legendary'],[8,'💛','Go-to'],[7,'👍','Solid'],[6,'🙂','Fine'],[5,'😐','Meh'],[0,'🚫','Never again']];
function tier(s){ if(s==null) return null; return TIERS.find(t=>s>=t[0]); }
const FACES=['😖','😖','😕','😕','😐','😐','🙂','😊','😋','🤩','🤯'];
function sliderHTML(name,val,unset){ const v=val==null?7:val; return `<div class="slider"><input type="range" id="sl-${name}" min="0" max="10" step="0.5" value="${v}" data-s="${name}" aria-label="Score"><span class="val tnum" data-sv="${name}">${unset?'<span style="color:var(--ink3)">—</span>':fmt(v)+'<small>'+FACES[Math.round(v)]+'</small>'}</span></div>`; }
function bindSliders(root,cb){ root.querySelectorAll('input[type=range]').forEach(r=>{ if(r._b) return; r._b=1; r.oninput=()=>{ const v=+r.value, out=root.querySelector(`[data-sv="${r.dataset.s}"]`); if(out){ out.innerHTML=fmt(v)+'<small>'+FACES[Math.round(v)]+'</small>'; out.style.color=scoreColor(v); } cb(r.dataset.s,v); }; }); }
function renderVisitForm(p){
  const v=editVisitId?p.visits.find(x=>x.id===editVisitId):null;
  const menu=MENUS[p.id];
  const picked=new Map(); // lowercased name -> {name,score}
  if(v) (v.dishes||[]).forEach(d=>picked.set(d.name.trim().toLowerCase(),{name:d.name,score:d.score}));
  const menuNames=new Set(((menu&&menu.items)||[]).map(i=>i.name.trim().toLowerCase()));
  // dishes rated here before that aren't on the menu
  const past=[]; const seenPast=new Set();
  for(const vv of p.visits) for(const d of vv.dishes||[]){ const k=d.name.trim().toLowerCase(); if(!menuNames.has(k)&&!seenPast.has(k)){ seenPast.add(k); past.push({name:d.name.trim()}); } }
  for(const [k,d] of picked) if(!menuNames.has(k)&&!seenPast.has(k)){ seenPast.add(k); past.push({name:d.name}); }
  let expVal=v?(typeof v.experience==='number'?v.experience:null):null;
  let filter='';
  const srcLine = menu&&menu.status==='ok'&&menu.items&&menu.items.length
    ? `Menu from <a href="${esc(menu.source)}" target="_blank" rel="noopener">${esc(hostOf(menu.source))}</a>${menu.asOf?' · as of '+esc(menu.asOf):''}`
    : menu&&menu.status==='closed' ? 'This spot may have closed. Add what you had below.'
    : menu ? 'No menu found online for this spot. Add what you had below.' : (DB?'Menu still loading. Add what you had below.':'Menus load in the claude.ai version. Add what you had below.');
  $('#dbody').innerHTML=`<div class="f up">
    <div class="vf-top"><span class="label">${v?'Edit visit':'✓ I’ve been here'}</span><div class="vf-date"><label class="l" for="vDate" style="margin:0">Date</label><input type="text" id="vDate" inputmode="numeric" value="${v?isoToMDY(v.date):todayMDY()}" placeholder="MM/DD/YY"></div></div>
    <div><span class="l" style="color:var(--food)">What did you get? Tap it, then rate it</span>
      <div class="hint" style="margin:0 0 8px">${srcLine}</div>
      <div id="pickedBar" class="pickedbar"></div>
      ${menu&&menu.items&&menu.items.length>8?'<div class="search" style="margin:0 0 8px"><span>⌕</span><input id="mq" type="search" placeholder="Find on the menu…" autocomplete="off"></div>':''}
      <div id="menuList" class="menulist"></div>
      <div class="addown"><input type="text" id="ownDish" placeholder="Something not on the menu?"><button class="btn g sm" id="ownAdd">Add</button></div>
    </div>
    <div class="card" style="padding:14px"><span class="l" style="color:var(--exp)">Overall experience: service, vibe, wait, value</span>${sliderHTML('exp',expVal,expVal==null)}<div class="hint">Leave at — to skip. The spot gets a combined score once it has both.</div></div>
    <div><label class="l" for="vNotes">Notes</label><textarea id="vNotes" placeholder="What stood out?">${esc(v?.notes||'')}</textarea></div>
    <div class="btnrow vf-save"><button class="btn p grow" id="saveV">${v?'Save changes':'Save visit'}</button><button class="btn g" id="cancelV">Cancel</button></div></div>`;
  const list=$('#menuList');
  function itemRow(name,price,i){
    const k=name.trim().toLowerCase(), on=picked.get(k);
    return `<div class="mi ${on?'on':''}" data-k="${esc(k)}" data-n="${esc(name)}"><button class="mi-h" type="button"><span class="mi-c">${on?'✓':''}</span><span class="mi-n">${esc(name)}</span>${price?`<span class="mi-p tnum">${esc(price)}</span>`:''}${on?`<span class="pill tnum" style="background:${scoreColor(on.score)}">${fmt(on.score)}</span>`:''}</button>${on?`<div class="mi-s">${sliderHTML('m'+i,on.score,false)}</div>`:''}</div>`;
  }
  function draw(){
    let h='', i=0;
    if(past.length){ const rows=past.filter(d=>!filter||d.name.toLowerCase().includes(filter)); if(rows.length){ h+=`<div class="msec">Had here before</div>`; rows.forEach(d=>h+=itemRow(d.name,'',i++)); } }
    if(menu&&menu.items){ let last=null; for(const it of menu.items){ if(filter&&!it.name.toLowerCase().includes(filter)&&!(it.section||'').toLowerCase().includes(filter)) continue; if(it.section!==last){ last=it.section; h+=`<div class="msec">${esc(it.section||'Menu')}</div>`; } h+=itemRow(it.name,it.price,i++); } }
    if(!h) h=`<div class="hint" style="padding:8px 2px">${filter?'Nothing on the menu matches. Add it below.':'Add what you had below.'}</div>`;
    list.innerHTML=h;
    list.querySelectorAll('.mi-h').forEach(b=>b.onclick=()=>{ const row=b.parentElement, k=row.dataset.k; if(picked.has(k)) picked.delete(k); else picked.set(k,{name:row.dataset.n,score:7}); draw(); drawBar(); });
    list.querySelectorAll('.mi').forEach(row=>{ const k=row.dataset.k; bindSliders(row,(name,val)=>{ const d=picked.get(k); if(d){ d.score=val; const pill=row.querySelector('.mi-h .pill'); if(pill){ pill.textContent=fmt(val); pill.style.background=scoreColor(val); } drawBar(); } }); });
  }
  function drawBar(){
    const ds=[...picked.values()];
    $('#pickedBar').innerHTML=ds.length?`<span class="label" style="color:var(--ink2)">${ds.length} dish${ds.length>1?'es':''} · food ${fmt(mean(ds.map(d=>d.score)))}</span>`:'';
  }
  draw(); drawBar();
  bindSliders($('#dbody').querySelector('.card'),(name,val)=>{ if(name==='exp') expVal=val; });
  const mq=$('#mq'); if(mq) mq.oninput=()=>{ filter=mq.value.trim().toLowerCase(); draw(); };
  const addOwn=()=>{ const n=$('#ownDish').value.trim(); if(!n) return; const k=n.toLowerCase(); if(!past.find(d=>d.name.toLowerCase()===k)&&!menuNames.has(k)) past.unshift({name:n}); if(!picked.has(k)) picked.set(k,{name:n,score:7}); $('#ownDish').value=''; filter=''; if(mq) mq.value=''; draw(); drawBar(); };
  $('#ownAdd').onclick=addOwn; $('#ownDish').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addOwn(); } };
  $('#cancelV').onclick=()=>{ drawerMode='view'; renderDrawer(); };
  $('#saveV').onclick=()=>{
    const iso=parseMDY($('#vDate').value); if(!iso){ $('#vDate').classList.add('bad'); toast('Type the date as MM/DD/YY'); return; }

    const st=spotState(p.id), before=p.sc.combined;
    const rec={id:v?.id||uid(),date:iso,experience:expVal,dishes:clean,notes:$('#vNotes').value.trim()};
    if(v) st.visits=st.visits.map(x=>x.id===v.id?rec:x); else st.visits.push(rec);
    st.want=false; save(p.id); drawerMode='view'; refreshAll();
    const np=PLACES.find(x=>x.id===p.id), after=np.sc.combined, tr=tier(after);
    if(after!=null&&np.rank===1){ toast('👑 '+np.name+' is your new Conshy champion!'); burst(np,['👑','✨','🎉',np.emoji],46); }
    else if(after!=null){ toast(`${tr[1]} ${tr[2]}! ${np.name}: ${fmt(after)}${before!=null?` (was ${fmt(before)})`:''} · #${np.rank} of ${RANKED.length}`); burst(np,after>=7?[np.emoji,'✨','😋']:[np.emoji,'💨'],after>=7?32:14); }
    else { toast(v?'Visit updated':'Been there! Add an experience score to rank it.'); burst(np,[np.emoji,'✨'],20); }
    if(!v){ const sz=sizeFor(np), big=sz.P+MODELS[np.mkey].top*sz.S; setTimeout(()=>map.easeTo({zoom:big>150?15.6:16.2,pitch:58,bearing:map.getBearing()+25,duration:2200}),150); }
  };
}

function burst(p,emojis,n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const pt=map.project([p.lng,p.lat]); const box=map.getContainer().getBoundingClientRect();
  const x0=box.left+pt.x, y0=box.top+pt.y-60;
  for(let i=0;i<n;i++){
    const e=document.createElement('div'); e.textContent=emojis[i%emojis.length];
    e.style.cssText=`position:fixed;left:${x0}px;top:${y0}px;font-size:${18+Math.random()*16}px;z-index:25;pointer-events:none;will-change:transform,opacity`;
    document.body.appendChild(e);
    const a=Math.random()*Math.PI*2, v=140+Math.random()*260, dx=Math.cos(a)*v, dy=Math.sin(a)*v-220, rot=(Math.random()-.5)*720;
    e.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(calc(-50% + ${dx*.6}px),calc(-50% + ${dy*.6}px)) scale(1.1) rotate(${rot/2}deg)`,opacity:1,offset:.45},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+380}px)) scale(.9) rotate(${rot}deg)`,opacity:0}],{duration:1500+Math.random()*700,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>e.remove();
  }
}

/* ================= add a spot ================= */
let addMode=false;
$('#bAdd').onclick=()=>{ if(preview) return toast('Exit preview first'); addMode=!addMode; document.body.classList.toggle('addmode',addMode); $('#bAdd').classList.toggle('on',addMode); if(isPhone()) setSheet(false); toast(addMode?'Tap the map where the spot is':'Cancelled'); };
function endAdd(){ addMode=false; document.body.classList.remove('addmode'); $('#bAdd').classList.remove('on'); }
function finishAdd(ll){
  endAdd(); const id='my-'+uid();
  S.custom.push({id,name:'New spot',kind:'restaurant',cuisine:'',address:'',lat:+ll.lat.toFixed(6),lng:+ll.lng.toFixed(6)});
  save(id); refreshAll(); selectedId=id; drawerMode='spot'; renderDrawer(); $('#drawer').classList.add('open'); setTimeout(()=>$('#sName')?.select(),60);
}

/* ================= camera ================= */
let orbitOn=false, orbitRaf;
function orbitStep(){ if(!orbitOn) return; map.rotateTo(map.getBearing()+.09,{duration:0}); orbitRaf=requestAnimationFrame(orbitStep); }
function startOrbit(){ orbitOn=true; $('#bOrbit').classList.add('on'); orbitStep(); }
function stopOrbit(){ orbitOn=false; cancelAnimationFrame(orbitRaf); $('#bOrbit').classList.remove('on'); }
$('#bOrbit').onclick=()=>orbitOn?stopOrbit():startOrbit();
['mousedown','touchstart','wheel'].forEach(ev=>map.getCanvas().addEventListener(ev,()=>{ stopOrbit(); if(tourOn) stopTour(); },{passive:true}));
let tourOn=false, tourT=[];
function stopTour(){ tourOn=false; tourT.forEach(clearTimeout); tourT=[]; $('#bTour').classList.remove('on'); $('#bTour .ic').textContent='▶'; $('#bTour .tx').textContent='Tour'; }
$('#bTour').onclick=()=>{
  if(tourOn) return stopTour();
  const stops=RANKED.slice(0,6).reverse();
  if(!stops.length) return toast('Rate a spot first, or try ✨ Preview sizes');
  tourOn=true; stopOrbit(); $('#bTour').classList.add('on'); $('#bTour .ic').textContent='■'; $('#bTour .tx').textContent='Stop';
  closeDrawer(); if(isPhone()) setSheet(false);
  map.flyTo({...HOME(),zoom:isPhone()?14.4:14.9,pitch:50,duration:2000});
  let t=2200;
  stops.forEach((p,i)=>{
    tourT.push(setTimeout(()=>{ if(!tourOn) return; const sz=sizeFor(p), big=sz.P+MODELS[p.mkey].top*sz.S; select(p.id,false);
      map.flyTo({center:[p.lng,p.lat],zoom:big>100?16.1:16.9,pitch:64,bearing:-40+i*55,padding:flyPad(),duration:2600,essential:true});
      tourT.push(setTimeout(()=>{ if(tourOn) map.easeTo({bearing:map.getBearing()+35,duration:2600,easing:x=>x}); },2650)); },t));
    t+=5600;
  });
  tourT.push(setTimeout(()=>{ if(!tourOn) return; stopTour(); closeDrawer(); map.flyTo({...HOME(),duration:2600}); setTimeout(startOrbit,2700); },t));
};
$('#bReset').onclick=()=>{ stopTour(); closeDrawer(); map.flyTo({...HOME(),duration:1800}); };
let flat=false;
$('#b3d').onclick=()=>{ flat=!flat; $('#b3d .tx').textContent=flat?'3D':'2D'; map.easeTo({pitch:flat?0:58,bearing:flat?0:-28,duration:1200}); };

/* ================= preview ================= */
$('#bPreview').onclick=()=>preview?endPreview():startPreview();
$('#endPreview').onclick=()=>endPreview();
function startPreview(){
  recompute();
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  preview={};
  PLACES.filter(p=>!p.hidden).map(p=>p.id).sort().filter(()=>rnd()<.42).forEach(id=>{ const food=4.5+rnd()*5.3, exp=4.5+rnd()*5.3; preview[id]={food,exp,combined:(food+exp)/2,dishCount:0,dishList:[],best:null,visits:0}; });
  $('#banner').hidden=false; $('#bPreview').classList.add('on'); $('#bPreview .tx').textContent='Exit preview';
  if(drawerMode!=='view'){ drawerMode='view'; }
  refreshAll(); map.flyTo({...HOME(),zoom:isPhone()?14.4:15.1,duration:1600});
}
function endPreview(){ preview=null; $('#banner').hidden=true; $('#bPreview').classList.remove('on'); $('#bPreview .tx').textContent='Preview sizes'; stopTour(); refreshAll(); }

/* ================= refresh ================= */
function refreshAll(intro){
  recompute();
  if(intro){ PLACES.slice().sort((a,b)=>(a.sc.combined??-1)-(b.sc.combined??-1)).forEach((p,i)=>{ p._delay=1500+i*30; }); }
  renderKPIs(); renderList(); syncMarkers();
  if($('#drawer').classList.contains('open') && selectedId && drawerMode==='view') renderDrawer();
  startAnim();
}
setSaveUI();
})();
</script>
